name: Tester

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  passing-level:
    name: Godkänt nivå
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: bank_app
      DB_PASSWORD: bank_password
      DB_NAME: bank

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bank
          MYSQL_USER: bank_app
          MYSQL_PASSWORD: bank_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Hämta repository
        uses: actions/checkout@v4

      - name: Installera Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Kontrollera projektstruktur
        shell: bash
        run: |
          test -f frontend/package.json
          test -f frontend/package-lock.json
          test -f backend/package.json
          test -f backend/package-lock.json

      - name: Installera frontend
        run: npm ci --prefix frontend

      - name: Installera backend
        run: npm ci --prefix backend

      - name: Installera tester
        run: npm ci --prefix tests

      - name: Installera Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Installera MySQL-klient
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Skapa testdatabasens tabeller
        run: |
          mysql \
            -h 127.0.0.1 \
            -P 3306 \
            -u bank_app \
            -pbank_password \
            bank < database/init.sql

      - name: Bygg frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
        run: npm run build --prefix frontend

      - name: Kör tester
        run: npm test --prefix tests
